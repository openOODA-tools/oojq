name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oojq

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac

      - uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar

      - uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std

      - name: Require compiler and clang
        working-directory: ${{ github.workspace }}
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }

      - name: Build oodar libs
        working-directory: ${{ github.workspace }}
        run: make -C oodar/scripts -f Makefile modular

      - name: Build, verify, and test
        working-directory: ${{ github.workspace }}/oojq
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OO_LIST_AMBIENT_QUOTA: 8589934592
        run: make all

      - name: Stage release asset
        working-directory: ${{ github.workspace }}
        run: |
          cp oojq/dist/oojq oojq-linux-x86_64
          sha256sum oojq-linux-x86_64 > oojq-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: oojq-linux-x86_64
          path: |
            oojq-linux-x86_64
            oojq-linux-x86_64.sha256

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oojq

      - uses: actions/download-artifact@v4
        with:
          name: oojq-linux-x86_64
          path: ${{ github.workspace }}/dist

      - name: Build .deb
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper build-essential
          cp -r oojq/packaging/debian oojq/debian
          cd oojq && dpkg-buildpackage -us -uc -b
          ls ../*.deb

      - name: Build .rpm
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get install -y -qq rpm
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/RPMS
          cp dist/oojq-linux-x86_64 ~/rpmbuild/SOURCES/
          sed "s/^Version:.*/Version: ${GITHUB_REF_NAME#v}/" oojq/packaging/oojq.spec > ~/rpmbuild/SPECS/oojq.spec
          rpmbuild -bb ~/rpmbuild/SPECS/oojq.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm .

      - name: Build Arch package and stage PKGBUILD
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get install -y -qq zstd
          mkdir -p arch-pkg/usr/bin
          cp dist/oojq-linux-x86_64 arch-pkg/usr/bin/oojq
          chmod 0755 arch-pkg/usr/bin/oojq
          BIN_SIZE=$(stat -c %s dist/oojq-linux-x86_64)
          BUILD_DATE=$(date +%s)
          PKGVER="${GITHUB_REF_NAME#v}"
          printf "pkgname = oojq\npkgbase = oojq\npkgver = ${PKGVER}-1\npkgdesc = Capability-bounded jq replacement with stdio MCP\nurl = https://github.com/openOODA-tools/oojq\nbuilddate = ${BUILD_DATE}\npackager = openOODA-tools <ops@openooda.org>\nsize = ${BIN_SIZE}\narch = x86_64\nlicense = Apache-2.0\ndepend = glibc\nprovides = oojq\n" > arch-pkg/.PKGINFO
          tar --zstd -cf "oojq-${PKGVER}-1-x86_64.pkg.tar.zst" -C arch-pkg .PKGINFO usr
          SHA256_VAL=$(awk '{print $1}' dist/oojq-linux-x86_64.sha256 2>/dev/null || sha256sum dist/oojq-linux-x86_64 | awk '{print $1}')
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" oojq/packaging/PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA256_VAL}')/" oojq/packaging/PKGBUILD
          cp oojq/packaging/PKGBUILD ./PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: oojq-packages
          path: |
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.rpm
            ${{ github.workspace }}/*.pkg.tar.zst
            ${{ github.workspace }}/PKGBUILD

  publish:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/assets

      - name: Create or update GitHub release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find assets -type f | sort
          gh release upload "${GITHUB_REF_NAME}" \
            assets/oojq-linux-x86_64/oojq-linux-x86_64 \
            assets/oojq-linux-x86_64/oojq-linux-x86_64.sha256 \
            assets/oojq-packages/*.deb \
            assets/oojq-packages/*.rpm \
            assets/oojq-packages/*.pkg.tar.zst \
            assets/oojq-packages/PKGBUILD \
            --clobber 2>/dev/null || \
          gh release create "${GITHUB_REF_NAME}" \
            --title "oojq ${GITHUB_REF_NAME}" \
            --notes "oojq ${GITHUB_REF_NAME}: Capability-bounded jq replacement with 98% jq parity, exact arithmetic, and an agent-native MCP server over stdio. 100% openOODA. Install: curl -fsSL https://openooda-tools.github.io/oojq/install.sh | bash" \
            assets/oojq-linux-x86_64/oojq-linux-x86_64 \
            assets/oojq-linux-x86_64/oojq-linux-x86_64.sha256 \
            assets/oojq-packages/*.deb \
            assets/oojq-packages/*.rpm \
            assets/oojq-packages/*.pkg.tar.zst \
            assets/oojq-packages/PKGBUILD

